name: hubspot_flutter_chat
description: >-
  Flutter plugin bridging HubSpot's native iOS & Android mobile chat SDKs to
  Flutter via type-safe Pigeon platform channels. Part of the hubspot_flutter toolkit.
version: 0.1.0
repository: https://github.com/Marl0nL/hubspot_flutter
issue_tracker: https://github.com/Marl0nL/hubspot_flutter/issues
homepage: https://github.com/Marl0nL/hubspot_flutter

topics:
  - hubspot
  - chat
  - live-chat
  - conversations

environment:
  sdk: ^3.12.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Pigeon-generated code (lib/src/messages.g.dart) imports package:meta.
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.marl0nl.hubspot_flutter_chat
        pluginClass: HubspotChatPlugin
      ios:
        pluginClass: HubspotChatPlugin
