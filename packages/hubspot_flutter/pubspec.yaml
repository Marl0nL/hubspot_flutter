name: hubspot_flutter
description: >-
  Pure-Dart HubSpot client: core HTTP layer, pluggable auth, cursor pagination,
  typed errors, and the client-safe REST modules (Forms, Content Search, HubDB).
version: 0.1.0
repository: https://github.com/Marl0nL/hubspot_flutter
issue_tracker: https://github.com/Marl0nL/hubspot_flutter/issues
homepage: https://github.com/Marl0nL/hubspot_flutter

# NOTE: This package is intentionally PURE DART. It must never depend on Flutter
# so it can run on a Dart backend. Flutter-only code (chat bridge, UI widgets)
# lives in the sibling packages hubspot_flutter_chat and hubspot_flutter_forms.

topics:
  - hubspot
  - crm
  - api-client
  - forms

environment:
  sdk: ^3.12.0

dependencies:
  dio: ^5.9.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
