name: hubspot_flutter_chat_web
description: >-
  Embed HubSpot's browser Conversations chat widget inside a bounded Flutter
  WebView — an inline, full-panel chat you host in your own app chrome. The
  supported, self-hosted alternative to the native mobile chat SDK bridge.
  Part of the hubspot_flutter toolkit.
version: 0.1.0
repository: https://github.com/Marl0nL/hubspot_flutter
issue_tracker: https://github.com/Marl0nL/hubspot_flutter/issues
homepage: https://github.com/Marl0nL/hubspot_flutter

# Standalone Flutter package (no mono-repo path dependency), but not published to
# pub.dev yet — kept private while the API settles. Remove this line to publish.
publish_to: none

topics:
  - hubspot
  - chat
  - conversations
  - webview

environment:
  sdk: ^3.12.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
